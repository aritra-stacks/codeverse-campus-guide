<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeVerse Campus Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CodeVerse Campus Guide</h1>
  <p class="subtitle">Find labs, faculty, clubs, events and facilities on campus</p>

  <input type="text" id="searchBox" placeholder="Search labs, faculty, clubs, events...">

  <div id="categories">
    <button class="cat-btn active" data-category="All">All</button>
    <button class="cat-btn" data-category="Laboratory">Laboratory</button>
    <button class="cat-btn" data-category="Faculty">Faculty</button>
    <button class="cat-btn" data-category="Club">Club</button>
    <button class="cat-btn" data-category="Event">Event</button>
    <button class="cat-btn" data-category="Facility">Facility</button>
  </div>

  <h2 class="section-title">Campus Map</h2>
  <div id="campusMap" class="campus-map">
    <button class="building" data-building="Block A" style="grid-area: a">
      <span class="b-name">Block A</span><span class="b-count"></span>
    </button>
    <button class="building" data-building="Block B" style="grid-area: b">
      <span class="b-name">Block B</span><span class="b-count"></span>
    </button>
    <button class="building" data-building="Block C" style="grid-area: c">
      <span class="b-name">Block C</span><span class="b-count"></span>
    </button>

    <div class="road">Main Road</div>

    <button class="building" data-building="Main Auditorium" style="grid-area: aud">
      <span class="b-name">Main Auditorium</span><span class="b-count"></span>
    </button>
    <button class="building" data-building="Student Center" style="grid-area: sc">
      <span class="b-name">Student Center</span><span class="b-count"></span>
    </button>
    <button class="building" data-building="Library Building" style="grid-area: lib">
      <span class="b-name">Library Building</span><span class="b-count"></span>
    </button>
  </div>
  <div id="mapStatus"></div>

  <div id="recommended" class="recommended hidden">
    <h2 class="section-title">
      Suggestions for you
      <button id="resetHistory" class="reset-btn">Reset</button>
    </h2>
    <div id="recommendedList"></div>
  </div>

  <h2 class="section-title">All Resources</h2>
  <div id="results"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="close-btn">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer class="site-footer">
    Made by Code Verse Team
    Aritra Das,Kamaldeep
  </footer>

  <script src="script.js"></script>
</body>
</html>
